# 保険: release/hotfix を head とする PR でバージョン一致を検証する
# （レベルBでは通常 PR を作らないため保険。pull_request の branches: は base にしか
#   効かないので head は if で絞る）
name: Version Guard
on:
  pull_request:
jobs:
  guard:
    if: startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version files match branch name
        run: |
          set -euo pipefail
          VER="${GITHUB_HEAD_REF#*/}"
          bash .github/scripts/verify_version.sh "$VER"
