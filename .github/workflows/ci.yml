# CI: pytest（設計書 §14）
#
# トリガは develop への push・develop 宛の PR・master への push の3つ。
# release/hotfix では回さない — その中身は develop の時点で既にテスト済みであり、
# release ブランチを切る行為自体は検証対象ではないため。
# master を含めるのは人が直接 push した場合の保険。リリース時に bot が行う master への
# マージは GITHUB_TOKEN の push なのでワークフローを起動せず、二重実行にはならない。
name: CI
on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["develop"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        # 必須依存は sqlalchemy のみ。任意 extra は無い（設計書 §13）
        run: uv sync
      - name: Run tests
        # akasyx_crawler は別リポジトリで CI には無い。テストは crawler を一切必要と
        # しない（fake_crawler フィクスチャが crawler_client を丸ごと肩代わりし、
        # 判定ロジックは fs_files 相当の一時 DB で回る — 設計書 §14）
        run: uv run pytest
