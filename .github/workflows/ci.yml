# CI: pytest（設計書 §14）
#
# トリガは develop への push・develop 宛の PR・master への push の3つ。
# release/hotfix では回さない — リリース時のテストは release-branch.yml 内の
# ゲートジョブが実行する（同じ tests.yml を呼ぶので中身は同一）。
# master を含めるのは人が直接 push した場合の保険。リリース時に bot が行う master への
# マージは GITHUB_TOKEN の push なのでワークフローを起動せず、二重実行にはならない。
name: CI
on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["develop"]
jobs:
  test:
    uses: ./.github/workflows/tests.yml
